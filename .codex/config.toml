model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
developer_instructions = "You are running in a Docker container.You cannot run Docker."
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "live"
plan_mode_reasoning_effort = "xhigh"
check_for_update_on_startup = false
service_tier = "fast"

[projects."/workspace"]
trust_level = "trusted"

[shell_environment_policy]
inherit = "all"

[tui]
show_tooltips = false
notifications = true
notification_method = "osc9"
theme = "gruvbox-dark"
vim_mode_default = true
status_line = ["model-with-reasoning", "context-used", "five-hour-limit", "weekly-limit", "total-input-tokens", "total-output-tokens", "fast-mode"]
